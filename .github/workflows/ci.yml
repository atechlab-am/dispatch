name: Test & Deploy

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Run backend test suite ─────────────────────────────────────────────────
  test-backend:
    name: Test (backend)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Run tests
        working-directory: backend
        env:
          SECRET_KEY: ci-test-secret-not-for-production
          SMTP_HOST: ""
        run: pytest tests/ -v --tb=short

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/

  # ── Run frontend test suite ────────────────────────────────────────────────
  test-frontend:
    name: Test (frontend)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:run

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-results
          path: src/

  # ── Push dev → main after tests pass ──────────────────────────────────────
  push-to-main:
    name: Push to main
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Push dev to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git push origin HEAD:main

  # ── Tag + GitHub Release from VERSION, after main is updated ───────────────
  create-release:
    name: Create release
    runs-on: ubuntu-latest
    needs: push-to-main
    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create tag + release if this version isn't already released
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(tr -d ' \t\n\r' < VERSION)"
          tag="v${version}"

          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists — skipping (no version bump since last release)."
            exit 0
          fi

          # Extract this version's section from CHANGELOG.md: from the
          # "## [x.y.z]" heading up to (not including) the next "## [" heading.
          notes="$(awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md)"

          if [ -z "$notes" ]; then
            echo "No CHANGELOG.md section found for $version — using a minimal body."
            notes="Release $tag."
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "$tag"
          git push origin "$tag"

          gh release create "$tag" \
            --title "$tag" \
            --notes "$notes"

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index portal.html;

    client_max_body_size 1m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Only proxy portal API endpoints — all other /api/* return 404
    location /api/portal/ {
        proxy_pass         http://backend:8000/api/portal/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # Block all other /api/ requests — staff endpoints are not reachable
    location /api/ {
        return 404;
    }

    # Serve portal SPA for all /p/* routes
    location /p/ {
        try_files $uri $uri/ /portal.html;
    }

    # Anything that isn't /p/* or /api/portal/* gets the portal 404 page
    location / {
        try_files $uri /portal.html;
    }
}
